[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bananame-code"
version = "0.1.1"
description = "Headless AI-to-AI coding substrate for bounded repository understanding, guarded transactional mutation, and machine-verifiable evidence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "BananaMe contributors"}]
keywords = [
  "ai-agents", "coding-agents", "mcp", "model-context-protocol",
  "code-intelligence", "search-replace", "transactional-editing", "verification"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
bananame = "bananame.cli:main"
bananame-mcp = "bananame.mcp_server:main"

[project.urls]
Repository = "https://github.com/tonnestate/BananaMe"
Issues = "https://github.com/tonnestate/BananaMe/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bananame*"]

[tool.setuptools.package-data]
bananame = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
